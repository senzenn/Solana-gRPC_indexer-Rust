<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>index live</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; background: #0b0d10; color: #e8edf2; }
    header { padding: 16px 20px; border-bottom: 1px solid #232833; display: flex; gap: 24px; align-items: baseline; }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .stat { color: #8b98a8; font-size: 13px; }
    .stat b { color: #7ee787; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1b2028; }
    th { color: #8b98a8; font-weight: 500; position: sticky; top: 0; background: #0b0d10; }
    .kind { color: #79c0ff; }
    .gap { color: #ffa657; }
    .drift { color: #ff7b72; }
  </style>
</head>
<body>
  <header>
    <h1>index stream</h1>
    <div class="stat">slot <b id="slot">-</b></div>
    <div class="stat">events <b id="count">0</b></div>
    <div class="stat">ws <b id="ws">connecting</b></div>
  </header>
  <table>
    <thead>
      <tr><th>slot</th><th>kind</th><th>program</th><th>detail</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const rows = document.getElementById("rows");
    const slotEl = document.getElementById("slot");
    const countEl = document.getElementById("count");
    const wsEl = document.getElementById("ws");
    let n = 0;
    function detail(e) {
      if (e.type === "token_transfer") return e.amount + "  " + (e.source || "").slice(0, 8) + " -> " + (e.destination || "").slice(0, 8);
      if (e.type === "program_ix") return e.instruction + "  " + (e.signature || "").slice(0, 12);
      if (e.type === "gap") return e.from_slot + ".." + e.to_slot;
      if (e.type === "idl_drift") return e.severity + "  " + e.summary;
      if (e.type === "slot") return "";
      return JSON.stringify(e);
    }
    function add(e) {
      n += 1;
      countEl.textContent = n;
      if (e.slot) slotEl.textContent = e.slot;
      const tr = document.createElement("tr");
      const kind = e.type || "";
      tr.innerHTML = "<td>" + (e.slot || "") + "</td><td class='kind " + kind + "'>" + kind + "</td><td>" + (e.program_name || e.program || e.program_id || "") + "</td><td>" + detail(e) + "</td>";
      rows.prepend(tr);
      while (rows.children.length > 200) rows.removeChild(rows.lastChild);
    }
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/stream");
      ws.onopen = () => { wsEl.textContent = "live"; };
      ws.onclose = () => { wsEl.textContent = "reconnect"; setTimeout(connect, 1000); };
      ws.onerror = () => { wsEl.textContent = "error"; };
      ws.onmessage = (m) => { try { add(JSON.parse(m.data)); } catch (e) {} };
    }
    connect();
  </script>
</body>
</html>
