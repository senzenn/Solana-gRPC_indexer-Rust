[package]
name = "idl-drift"
description = "Semantic drift detection for Solana program IDLs. Flags parser-breaking changes before they silently corrupt data. Vixen-compatible."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rpcpool/yellowstone-vixen"

# Dependencies are limited to permissive licenses accepted by Vixen's deny.toml
# (MIT / Apache-2.0). serde, serde_json, clap all qualify.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
# Same crate / version Yellowstone Vixen's `include_vixen_parser!` deserializes.
# Apache-2.0 — accepted by Vixen's deny.toml.
codama-nodes = "=0.9.1"
# Discriminator byte decoding for Codama `bytesValueNode` encodings.
# Without these, base58/base64 discs were stored as encoded-string bytes and
# compared unequal to the same value written as base16 (false Breaking).
bs58 = "0.5"
base64 = "0.22"
owo-colors = "4"

[[bin]]
name = "idl-drift"
path = "src/main.rs"

[lib]
name = "idl_drift"
path = "src/lib.rs"

[lints.clippy]
# Mirror Vixen's crate-level lint gate so this crate passes the same CI.
pedantic = { level = "warn", priority = -1 }
